<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Besh Express — панель</title>
<style>
:root{--navy:#0B2A5B;--green:#22C55E;--bg:#F3F5F9;--line:#DDE2EC;--mut:#6B7280}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Arial,Helvetica,sans-serif;background:var(--bg);color:#111827}
[hidden]{display:none!important}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{font-weight:700;font-size:20px}header .logo span{color:var(--green)}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{background:transparent;border:0;color:#cbd5e1;padding:8px 12px;border-radius:8px;font-size:15px;cursor:pointer}
.tab.on{background:#fff2;color:#fff}
button.out{background:transparent;border:1px solid #fff5;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:14px}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.st small{color:var(--mut);display:block}.st b{font-size:20px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px}small{color:var(--mut)}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;background:#E5E7EB}
.s-completed,.d-approved{background:#DCFCE7;color:#166534}
.s-searching,.d-pending{background:#FEF3C7;color:#92400E}
.s-cancelled,.d-blocked{background:#FEE2E2;color:#991B1B}
.s-accepted,.s-arrived,.s-in_progress{background:#DBEAFE;color:#1E40AF}
button.p,button.s,button.d{border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;margin:4px 6px 0 0}
button.p{background:var(--green);color:#052e16;font-weight:700}
button.s{background:#E5E7EB;color:#111827}button.d{background:#FEE2E2;color:#991B1B}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:13px;color:var(--mut)}
input[type=number],input[type=email],input[type=password]{display:block;width:140px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-top:3px}
.dr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9CA3AF;margin-right:5px}.dot.on{background:var(--green)}
#login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
#login input{width:100%}#login h1{margin:0 0 14px;color:var(--navy)}#login h1 span{color:var(--green)}
#err{color:#B91C1C;min-height:20px;margin:8px 0}.empty{padding:24px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div id="login">
  <h1>Besh <span>Express</span></h1>
  <form id="lf">
    <label>Почта<input type="email" id="em" required></label><br>
    <label>Пароль<input type="password" id="pw" required></label>
    <div id="err"></div>
    <button class="p" style="width:100%">Войти</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="logo">Besh <span>Express</span></div>
    <nav>
      <button class="tab" data-tab="orders">Заказы</button>
      <button class="tab" data-tab="drivers">Водители</button>
      <button class="tab" data-tab="tariffs">Тарифы</button>
      <button class="tab" data-tab="settings">Настройки</button>
    </nav>
    <button class="out" data-act="out">Выйти</button>
  </header>
  <main><div id="stats"></div><div id="view"></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
if (typeof supabase === 'undefined') {
  document.getElementById('err').textContent = 'Не загрузилась библиотека Supabase. Откройте файл в обычном браузере (Chrome) с интернетом.';
}
const SB = supabase.createClient('https://krphkeevnrtkcnsqbxfo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtycGhrZWV2bnJ0a2Nuc3FieGZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODE0NzQsImV4cCI6MjEwNzk1NzQ3NH0.gXe8uTesz1NSEmiRTBXiP3uvAEm9GV2OENcLaVfyIoU', {auth: {storageKey: 'besh-panel-auth'}});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + ' сум';
const tm = s => new Date(s).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
const ST = {searching:'Поиск', accepted:'Принят', arrived:'Водитель на месте', in_progress:'В пути', completed:'Завершён', cancelled:'Отменён'};
const DS = {pending:'Ждёт одобрения', approved:'Одобрен', blocked:'Заблокирован'};
let tab = 'orders';

async function run(p) {
  const r = await p;
  if (r.error) { alert('Ошибка: ' + r.error.message); throw r.error; }
  return r.data;
}

const views = {
  async orders() {
    const d = await run(SB.from('orders')
      .select('*, client:profiles!orders_client_id_fkey(full_name,phone), driver:drivers!orders_driver_id_fkey(plate,car_model)')
      .order('created_at', {ascending:false}).limit(50));
    if (!d.length) return '<div class="card empty">Заказов пока нет</div>';
    return `<div class="card tw"><table><tr><th>Время</th><th>Клиент</th><th>Маршрут</th><th>Цена</th><th>Комиссия</th><th>Водитель</th><th>Статус</th></tr>` +
      d.map(o => `<tr><td>${tm(o.created_at)}</td>
        <td>${esc(o.client?.full_name || '—')}<br><small>${esc(o.client?.phone || '')}</small></td>
        <td>${esc(o.pickup_address || '—')} → ${esc(o.dropoff_address || '—')}<br><small>${o.distance_km} км</small></td>
        <td>${fmt(o.price)}</td><td>${o.commission > 0 ? fmt(o.commission) : '—'}</td>
        <td>${o.driver ? esc(o.driver.car_model) + '<br><small>' + esc(o.driver.plate) + '</small>' : '—'}</td>
        <td><span class="b s-${o.status}">${ST[o.status]}</span></td></tr>`).join('') + '</table></div>';
  },

  async drivers() {
    const [d, w] = await Promise.all([
      run(SB.from('drivers').select('*, p:profiles!drivers_id_fkey(full_name,phone)').order('created_at', {ascending:false})),
      run(SB.from('wallets').select('*'))]);
    if (!d.length) return '<div class="card empty">Водителей пока нет</div>';
    const wm = Object.fromEntries(w.map(x => [x.user_id, x]));
    const ph = await run(SB.from('driver_photos').select('driver_id,kind,path')), urls = {}, pm = {};
    if (ph.length) { const {data: sg} = await SB.storage.from('driver-docs').createSignedUrls(ph.map(x => x.path), 3600); (sg || []).forEach(s => { urls[s.path] = s.signedUrl; }); }
    ph.forEach(x => (pm[x.driver_id] = pm[x.driver_id] || []).push(x));
    const PL = {license: 'Права', tech_passport: 'Техпаспорт', car_front: 'Спереди', car_back: 'Сзади', car_interior: 'Салон'};
    const today = new Date().toISOString().slice(0, 10);
    return '<div class="dr">' + d.map(x => {
      const wl = wm[x.id] || {balance:0, bonus_balance:0};
      const exp = x.license_card_expiry && x.license_card_expiry < today ? ' <span class="b d-blocked">просрочена</span>' : '';
      return `<div class="card">
        <b>${esc(x.p?.full_name || 'Без имени')}</b> <span class="b d-${x.status}">${DS[x.status]}</span><br>
        <small>${esc(x.p?.phone || '')}</small><br>
        <span class="dot ${x.is_online ? 'on' : ''}"></span>${x.is_online ? 'Онлайн' : 'Офлайн'}<br>
        ${esc(x.car_model)}, ${esc(x.car_color)} · <b>${esc(x.plate)}</b><br>
        <small>Права: ${esc(x.license_no)} · ПИНФЛ: ${esc(x.pinfl || '—')}<br>
        Самозанятый: ${x.is_self_employed ? 'да' : 'нет'} · Карточка: ${esc(x.license_card_no || '—')} ${esc(x.license_card_expiry || '')}${exp}</small><br>
        <div style="margin:6px 0"><small>Фото: ${(pm[x.id] || []).length}/5</small><br>${(pm[x.id] || []).map(f => urls[f.path] ? `<a href="${urls[f.path]}" target="_blank"><img src="${urls[f.path]}" title="${PL[f.kind]}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;margin:2px"></a>` : '').join('')}</div>
        Баланс: <b>${fmt(wl.balance)}</b> · Бонус: <b>${fmt(wl.bonus_balance)}</b><br>
        ${x.status === 'pending' ? `<button class="p" data-act="approve" data-ph="${(pm[x.id] || []).length}" data-id="${x.id}">Одобрить</button>` : ''}
        ${x.status === 'blocked' ? `<button class="s" data-act="unblock" data-id="${x.id}">Разблокировать</button>` : `<button class="d" data-act="block" data-id="${x.id}">Заблокировать</button>`}
        <button class="s" data-act="topup" data-id="${x.id}">Пополнить</button></div>`;
    }).join('') + '</div>';
  },

  async tariffs() {
    const d = await run(SB.from('tariffs').select('*').order('zone').order('name'));
    return d.map(x => `<div class="card row" data-t="1"><b style="min-width:130px">${esc(x.name)} · ${x.zone === 'city' ? 'город' : 'пригород'}</b>
      <label>Посадка, сум<input type="number" data-k="base_fare" value="${x.base_fare}"></label>
      <label>За км, сум<input type="number" data-k="per_km" value="${x.per_km}"></label>
      <label>Минимум, сум<input type="number" data-k="min_fare" value="${x.min_fare}"></label>
      <label><input type="checkbox" data-k="active" ${x.active ? 'checked' : ''}> Включён</label>
      <button class="p" data-act="savetariff" data-id="${x.id}">Сохранить</button></div>`).join('') +
      `<div class="card row" data-n="1"><b style="min-width:130px">Новый тариф</b>
        <label>Название<input type="text" data-k="name" placeholder="Комфорт" style="display:block;width:140px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:3px;font-size:15px"></label>
        <label>Зона<select data-k="zone" style="display:block;padding:9px;border:1px solid var(--line);border-radius:8px;margin-top:3px;font-size:15px"><option value="city">Город</option><option value="suburb">Пригород</option></select></label>
        <label>Посадка, сум<input type="number" data-k="base_fare" value="2000"></label>
        <label>За км, сум<input type="number" data-k="per_km" value="1000"></label>
        <label>Минимум, сум<input type="number" data-k="min_fare" value="3000"></label>
        <button class="p" data-act="addtariff">Добавить</button></div>` +
      '<p><small>Цена = посадка + за км × расстояние, но не меньше минимума. Округляется до 100 сум.</small></p>';
  },

  async settings() {
    const d = await run(SB.from('settings').select('*').order('key'));
    return d.map(x => `<div class="card row" data-s="1"><label style="min-width:260px">${esc(x.note || x.key)}<input type="number" value="${x.value}"></label>
      <button class="p" data-act="savesetting" data-id="${esc(x.key)}">Сохранить</button></div>`).join('');
  }
};

async function stats() {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0); const iso = d0.toISOString();
  const cnt = q => q.then(r => r.count || 0);
  const [n, online, pend, done] = await Promise.all([
    cnt(SB.from('orders').select('id', {count:'exact', head:true}).gte('created_at', iso)),
    cnt(SB.from('drivers').select('id', {count:'exact', head:true}).eq('is_online', true)),
    cnt(SB.from('drivers').select('id', {count:'exact', head:true}).eq('status', 'pending')),
    SB.from('orders').select('commission').eq('status', 'completed').gte('completed_at', iso).then(r => r.data || [])]);
  const com = done.reduce((s, o) => s + Number(o.commission), 0);
  $('#stats').innerHTML = [['Заказов сегодня', n], ['Завершено', done.length], ['Комиссия сегодня', fmt(com)],
    ['Водителей онлайн', online], ['Ждут одобрения', pend]].map(([a, b]) => `<div class="st"><small>${a}</small><b>${b}</b></div>`).join('');
}

async function render() {
  try {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    await stats();
    $('#view').innerHTML = await views[tab]();
  } catch (e) { console.error(e); }
}

document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { tab = tb.dataset.tab; return render(); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.act;
  try {
    if (a === 'out') { await SB.auth.signOut(); return location.reload(); }
    if (a === 'approve') { if (b.dataset.ph !== '5' && !confirm('Загружены не все фото. Всё равно одобрить?')) return; await run(SB.rpc('approve_driver', {p_driver:id})); }
    if (a === 'block') { if (!confirm('Заблокировать?')) return; await run(SB.rpc('block_user', {p_user:id, p_blocked:true})); }
    if (a === 'unblock') { await run(SB.rpc('block_user', {p_user:id, p_blocked:false})); await run(SB.rpc('approve_driver', {p_driver:id})); }
    if (a === 'topup') {
      const v = Number(prompt('Сумма пополнения, сум')); if (!v) return;
      await run(SB.rpc('admin_topup', {p_user:id, p_amount:v, p_note:'Пополнение админом'}));
    }
    if (a === 'savetariff') {
      const o = {}; b.closest('[data-t]').querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.type === 'checkbox' ? i.checked : Number(i.value));
      await run(SB.from('tariffs').update(o).eq('id', id)); alert('Сохранено');
    }
    if (a === 'addtariff') {
      const o = {};
      b.closest('[data-n]').querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.type === 'number' ? Number(i.value) : i.value.trim());
      if (!o.name) return alert('Введите название тарифа');
      await run(SB.from('tariffs').insert(o)); alert('Тариф добавлен');
    }
    if (a === 'savesetting') {
      await run(SB.from('settings').update({value: Number(b.closest('[data-s]').querySelector('input').value)}).eq('key', id)); alert('Сохранено');
    }
  } catch (_) { return; }
  render();
});

$('#lf').addEventListener('submit', async e => {
  e.preventDefault(); $('#err').textContent = '';
  try {
    const {error} = await SB.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
    if (error) { $('#err').textContent = 'Ошибка входа: ' + error.message; return; }
    await enter();
  } catch (x) { $('#err').textContent = 'Ошибка: ' + x.message; }
});

let timer;
async function enter() {
  const {data:{user}} = await SB.auth.getUser();
  if (!user) return;
  const {data:p} = await SB.from('profiles').select('role').eq('id', user.id).maybeSingle();
  if (!p || p.role !== 'admin') { await SB.auth.signOut(); $('#err').textContent = 'Нет доступа: вы не администратор'; return; }
  $('#login').hidden = true; $('#app').hidden = false;
  render();
  const again = () => { clearTimeout(timer); timer = setTimeout(() => { if (tab === 'orders') render(); else stats(); }, 500); };
  SB.channel('adm')
    .on('postgres_changes', {event:'*', schema:'public', table:'orders'}, again)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'drivers'}, () => { if (tab === 'drivers') render(); })
    .subscribe();
}

SB.auth.getSession().then(({data}) => { if (data.session) enter(); });
</script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
